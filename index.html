// ---------- Parámetros de la búsqueda ----------
// Letras mínimas antes de buscar: con menos, casi cualquier nombre coincide.
const MIN_LETRAS = 3;
// Tope de nombres en la lista de candidatos, para que quepa en la pantalla del celular.
const MAX_CANDIDATOS = 8;
// Cambiar a false para que la escarapela muestre únicamente el sector.
const MOSTRAR_SUBSECTOR = true;
// Partículas que no ayudan a distinguir a una persona ("Laura del Pilar").
const PALABRAS_VACIAS = new Set(['de', 'del', 'la', 'las', 'los', 'y']);
// Errores de tecleo permitidos según el largo de la palabra:
// las palabras cortas no admiten errores porque "Luz" y "Luis" son nombres distintos.
const LARGO_SIN_ERRORES = 4;   // menos de 4 letras: 0 errores
const LARGO_DOS_ERRORES = 8;   // 8 letras o más: 2 errores; en medio: 1 error
// Puntos por palabra según qué tan buena es la coincidencia (solo importa el orden).
const PUNTOS_EXACTA = 3;
const PUNTOS_COMIENZO = 2;        // la persona todavía está escribiendo: "sebas" -> "sebastian"
const PUNTOS_PARECIDA = 1.5;      // palabra completa con algún error de tecleo
const PUNTOS_COMIENZO_PARECIDO = 1; // comienzo de la palabra con un error
// Desde este puntaje la coincidencia se considera firme (exacta o comienzo exacto).
const PUNTOS_FIRME = PUNTOS_COMIENZO;
// Largo mínimo para aceptar un comienzo con error; con menos letras hay demasiados falsos positivos.
const LARGO_COMIENZO_PARECIDO = 5;

// ---------- Normalización ----------
// Pasa a minúsculas y quita tildes, signos y espacios dobles: "  MARÍN " -> "marin".
function normalizar(texto) {
  return texto
    .toLowerCase()
    .normalize('NFD')                    // separa la letra de su tilde ("í" -> "i" + tilde)
    .replace(/[̀-ͯ]/g, '')     // borra las tildes ya separadas (la ñ queda como n)
    .replace(/[^a-z]+/g, ' ')            // todo lo que no sea letra pasa a ser un espacio
    .trim();
}

// Iguala letras que en español suenan igual, para que "Jhon/John", "Tabarez/Tabares"
// o "Giovany/Giovanni" den la misma clave. Se aplica igual al listado y a lo que se escribe,
// así que lo importante es que sea consistente, no que sea fonética perfecta.
function claveFonetica(palabra) {
  return palabra
    .replace(/h/g, '')            // la h es muda
    .replace(/ll/g, 'y')
    .replace(/v/g, 'b')
    .replace(/z/g, 's')
    .replace(/c(?=[ei])/g, 's')   // "ce", "ci" suenan como "se", "si"
    .replace(/y/g, 'i')
    .replace(/w/g, 'u')
    .replace(/(.)\1+/g, '$1');    // letras repetidas: "nn" -> "n"
}

// Convierte un texto en la lista de claves de sus palabras útiles.
function claves(texto) {
  return normalizar(texto)
    .split(' ')
    .filter(p => p && !PALABRAS_VACIAS.has(p))
    .map(claveFonetica);
}

// ---------- Parecido entre palabras ----------
// Distancia de Levenshtein: cuántas letras hay que cambiar, agregar o quitar
// para convertir una palabra en la otra. Es lo que permite tolerar errores de tecleo.
function distancia(a, b) {
  let anterior = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const actual = [i];
    for (let j = 1; j <= b.length; j++) {
      const costo = a[i - 1] === b[j - 1] ? 0 : 1;
      actual[j] = Math.min(anterior[j] + 1, actual[j - 1] + 1, anterior[j - 1] + costo);
    }
    anterior = actual;
  }
  return anterior[b.length];
}

function erroresPermitidos(largo) {
  if (largo < LARGO_SIN_ERRORES) return 0;
  if (largo < LARGO_DOS_ERRORES) return 1;
  return 2;
}

// Qué tan bien coincide una palabra escrita con una palabra del nombre (0 = no coincide).
function puntajePalabra(escrita, delNombre) {
  if (escrita === delNombre) return PUNTOS_EXACTA;
  if (escrita.length >= 2 && delNombre.startsWith(escrita)) return PUNTOS_COMIENZO;
  if (distancia(escrita, delNombre) <= erroresPermitidos(escrita.length)) return PUNTOS_PARECIDA;
  // Error de tecleo mientras aún se escribe: se compara solo con el comienzo de la palabra.
  if (escrita.length >= LARGO_COMIENZO_PARECIDO && escrita.length < delNombre.length &&
      distancia(escrita, delNombre.slice(0, escrita.length)) <= 1) return PUNTOS_COMIENZO_PARECIDO;
  return 0;
}

// Las claves de cada persona se calculan una sola vez, al cargar la página.
const INDICE = PERSONAS.map(persona => ({ persona, claves: claves(persona.nombre) }));

// Compara lo escrito con una persona: cuántas palabras coinciden, con qué puntaje,
// y si todas las coincidencias son firmes (sin depender de corregir errores).
function evaluar(escritas, entrada) {
  let coincidencias = 0, puntaje = 0, firme = true;
  for (const escrita of escritas) {
    const mejor = Math.max(...entrada.claves.map(c => puntajePalabra(escrita, c)));
    if (mejor > 0) { coincidencias++; puntaje += mejor; }
    if (mejor < PUNTOS_FIRME) firme = false;
  }
  return { persona: entrada.persona, coincidencias, puntaje, firme };
}

// Devuelve los candidatos para un texto. Solo quedan quienes coinciden con el mayor número
// de palabras escritas; así "Carolina Toro" no arrastra a todas las Carolinas.
function buscar(texto) {
  const escritas = claves(texto);
  const evaluadas = INDICE.map(e => evaluar(escritas, e)).filter(r => r.coincidencias > 0);
  if (evaluadas.length === 0) return { candidatos: [], completa: false };
  const maximo = Math.max(...evaluadas.map(r => r.coincidencias));
  const candidatos = evaluadas
    .filter(r => r.coincidencias === maximo)
    .sort((a, b) => b.puntaje - a.puntaje || a.persona.nombre.localeCompare(b.persona.nombre, 'es'));
  // "completa" indica que todas las palabras escritas encontraron pareja.
  return { candidatos, completa: maximo === escritas.length };
}

// ---------- Pantalla ----------
const campo = document.getElementById('nombre');
const zona = document.getElementById('resultado');

// Crea un elemento con clase y texto. Se usa textContent para que ningún dato se interprete como HTML.
function crear(etiqueta, clase, texto) {
  const el = document.createElement(etiqueta);
  if (clase) el.className = clase;
  if (texto !== undefined) el.textContent = texto;
  return el;
}

function unir(lista) {
  return lista.length > 1 ? lista.slice(0, -1).join(', ') + ' y ' + lista[lista.length - 1] : lista[0];
}

function mostrarVacio() {
  const tarjeta = crear('article', 'escarapela vacia');
  tarjeta.append(crear('span', 'ranura'), crear('p', 'persona', 'Tu sector aparecerá aquí.'));
  zona.replaceChildren(tarjeta);
}

function mostrarEscarapela(persona) {
  const tarjeta = crear('article', 'escarapela');
  const ranura = crear('span', 'ranura');
  ranura.setAttribute('aria-hidden', 'true');
  tarjeta.append(ranura, crear('p', 'persona', persona.nombre));
  for (const asignacion of persona.sectores) {
    const banda = crear('div', 'banda');
    banda.append(crear('p', 'rotulo', 'Tu sector'), crear('p', 'sector', asignacion.sector));
    tarjeta.append(banda);
    // El subsector solo aporta cuando es distinto del sector ("Salud / Salud" no dice nada nuevo).
    const subs = asignacion.subsectores.filter(s => s !== asignacion.sector);
    if (MOSTRAR_SUBSECTOR && subs.length > 0) {
      const bloque = crear('div', 'subsector');
      bloque.append(crear('p', 'rotulo', subs.length > 1 ? 'Subsectores' : 'Subsector'), crear('p', 'valor', unir(subs)));
      tarjeta.append(bloque);
    }
  }
  const otro = crear('button', 'otro', 'Buscar otro nombre');
  otro.type = 'button';
  otro.addEventListener('click', () => { campo.value = ''; mostrarVacio(); campo.focus(); });
  zona.replaceChildren(tarjeta, otro);
}

function mostrarLista(candidatos, aviso) {
  const lista = crear('ul', 'candidatos');
  for (const { persona } of candidatos.slice(0, MAX_CANDIDATOS)) {
    const boton = crear('button', '', persona.nombre);
    boton.type = 'button';
    boton.addEventListener('click', () => {
      campo.blur();               // esconde el teclado para que la escarapela quede a la vista
      mostrarEscarapela(persona);
    });
    const item = crear('li');
    item.append(boton);
    lista.append(item);
  }
  const partes = [crear('p', 'aviso', aviso), lista];
  if (candidatos.length > MAX_CANDIDATOS) {
    partes.push(crear('p', 'aviso-secundario', 'Hay más personas con ese nombre. Escribe también tu apellido.'));
  }
  zona.replaceChildren(...partes);
}

function mostrarNinguno() {
  zona.replaceChildren(
    crear('p', 'aviso', 'No encontramos ese nombre.'),
    crear('p', 'aviso-secundario', 'Prueba solo con tu primer nombre o solo con tu apellido. Si sigue sin aparecer, avísale al equipo organizador.')
  );
}

function actualizar() {
  const texto = campo.value;
  if (normalizar(texto).replace(/ /g, '').length < MIN_LETRAS) { mostrarVacio(); return; }
  const { candidatos, completa } = buscar(texto);
  if (candidatos.length === 0) { mostrarNinguno(); return; }
  // Se muestra el resultado de una vez solo si hay una única persona y la coincidencia es firme;
  // si dependió de corregir errores, se pregunta antes para no mostrarle a alguien el sector de otra persona.
  if (candidatos.length === 1 && completa && candidatos[0].firme) { mostrarEscarapela(candidatos[0].persona); return; }
  if (candidatos.length === 1) { mostrarLista(candidatos, '¿Eres esta persona? Toca el nombre:'); return; }
  mostrarLista(candidatos, completa
    ? 'Encontramos varias personas. Toca tu nombre:'
    : 'No hay una coincidencia exacta. ¿Eres alguna de estas personas?');
}

// Dibuja el apartado una sola vez al cargar; no depende de lo que se busque.
function mostrarLideres() {
  const apartado = document.getElementById('lideres');
  for (const grupo of LIDERES) {
    const bloque = crear('div', 'grupo');
    bloque.append(crear('h3', '', grupo.sector));
    // Si el sector tiene una sola sublínea y se llama igual ("Cultura / Cultura"),
    // repetir el nombre no aporta: se muestran solo las personas.
    const repetida = grupo.sublineas.length === 1 && grupo.sublineas[0].nombre === grupo.sector;
    for (const sublinea of grupo.sublineas) {
      const fila = crear('div', 'sublinea');
      if (!repetida) fila.append(crear('p', 'rotulo', sublinea.nombre));
      for (const lider of sublinea.lideres) fila.append(crear('p', 'lider', lider));
      bloque.append(fila);
    }
    apartado.append(bloque);
  }
}
mostrarLideres();

campo.addEventListener('input', actualizar);
// Al tocar "Buscar" en el teclado no se envía nada: solo se cierra el teclado.
document.getElementById('formulario').addEventListener('submit', e => { e.preventDefault(); campo.blur(); });
actualizar();
